# Tests use MySQL 8. phpunit.xml forces the same DB_* values (force="true"),
# and `php artisan test` starts PHPUnit in a fresh process, so this service
# must match phpunit.xml. Job env covers Artisan steps that run outside PHPUnit.
# SQLite is not the CI database.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laramine_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s
      openldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: Laramine
          LDAP_DOMAIN: example.test
          LDAP_ADMIN_PASSWORD: adminsecret
          LDAP_CONFIG_PASSWORD: adminsecret
          LDAP_TLS_VERIFY_CLIENT: never
        ports:
          - 389:389
          - 636:636
        options: >-
          --health-cmd="ldapsearch -x -H ldap://127.0.0.1:389 -b dc=example,dc=test -D cn=admin,dc=example,dc=test -w adminsecret -s base"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laramine_testing
      DB_USERNAME: root
      DB_PASSWORD: password
      LDAP_HOST: 127.0.0.1
      LDAP_PORT: 389
      LDAP_TLS_PORT: 636
      LDAP_BASE_DN: dc=example,dc=test
      LDAP_ADMIN_DN: cn=admin,dc=example,dc=test
      LDAP_ADMIN_PASSWORD: adminsecret
      LDAP_CONFIG_DN: cn=admin,cn=config
      LDAP_CONFIG_PASSWORD: adminsecret
      LDAP_PEOPLE_DN: ou=people,dc=example,dc=test

    steps:
      - uses: actions/checkout@v4

      - name: Install thumbnail converters
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript imagemagick libavif-bin libheif-dev libavif-dev

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, mysql, pdo_mysql, bcmath, intl, gd, imagick, ldap
          coverage: none

      - name: Install Composer deps
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pint
        run: composer lint

      - name: PHPStan
        run: composer stan

      - name: Seed OpenLDAP fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y ldap-utils
          tests/Parity/fixtures/redmine-7.0.1/ldap/seed.sh

      - name: Tests
        run: composer test

  # Client typecheck and Vite build. Does not replace the PHP gates above.
  # Inertia pages are not a product UI. See docs/ux-parity-notes.md.
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build client and SSR bundles
        run: npm run build
