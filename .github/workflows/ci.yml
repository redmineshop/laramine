# Tests use MySQL 8. phpunit.xml forces the same DB_* values (force="true"),
# and `php artisan test` starts PHPUnit in a fresh process, so this service
# must match phpunit.xml. Job env covers Artisan steps that run outside PHPUnit.
# SQLite is not the CI database.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laramine_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laramine_testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, mysql, pdo_mysql, bcmath, intl, gd
          coverage: none

      - name: Install Composer deps
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pint
        run: composer lint

      - name: PHPStan
        run: composer stan

      - name: Tests
        run: composer test

  # Client typecheck and Vite build. Does not replace the PHP gates above.
  # Inertia pages are not a product UI. See docs/ux-parity-notes.md.
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build client and SSR bundles
        run: npm run build
